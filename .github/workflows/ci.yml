name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pruebas unitarias e integración
        working-directory: tests
        run: python -m unittest -v
      - name: Escenario de 10 pasos (simulador)
        run: python -m cauce scenario --out reports
      - name: Guion de validación física con el simulador (no es validación física)
        run: python -m cauce fieldcheck --simulate --lab-url http://lab.sim:8770 --steps 60 --out reports/fieldcheck-sim
      - name: Escenario de dos sesiones de navegador (simulador, sin navegador real)
        run: python -m cauce scenario-sessions --out reports
      - name: Detección real de interfaces (Windows, solo lectura)
        if: runner.os == 'Windows'
        run: |
          python -m cauce doctor
          python -m cauce discover --raw reports/windows-runner-capture.json
          Get-Content reports/windows-runner-capture.json
      - name: Comprobación de los tres motores (Windows, solo lectura; aquí ninguno corre)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/validacion_fisica/TRES_MOTORES.ps1
      - name: Instalación aislada (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/install.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.os }}-${{ matrix.python }}
          path: reports/
  laboratorio-integrado:
    # Los tres motores a la vez en Windows con los lanzadores reales del paquete (red SIMULADA: no es validación física).
    name: Laboratorio integrado · Windows (Monitor + Forms + Network Engine)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CAUCE_LAB_SIN_PAUSA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 1_INSTALAR.cmd --navegador-forms (descarga Monitor y Forms en los commits fijados y Chromium para Forms)
        shell: cmd
        run: scripts\laboratorio_integrado\1_INSTALAR.cmd --navegador-forms
      - name: 2_INICIAR_Y_PROBAR.cmd (versiones, puertos, inicio, diagnóstico, NE apagado, interrupción, Forms con navegador)
        shell: cmd
        run: scripts\laboratorio_integrado\2_INICIAR_Y_PROBAR.cmd --no-abrir
      - name: Los tres puertos del laboratorio responden a la vez
        shell: pwsh
        run: |
          foreach ($p in 8100, 8865, 8880) {
            $ok = (Test-NetConnection -ComputerName 127.0.0.1 -Port $p -WarningAction SilentlyContinue).TcpTestSucceeded
            Write-Output "puerto $p : $ok"
            if (-not $ok) { exit 1 }
          }
      - name: 7_VALIDACION_INTEGRAL.cmd rapido (no interactivo; lo físico queda PENDIENTE)
        shell: cmd
        run: scripts\laboratorio_integrado\7_VALIDACION_INTEGRAL.cmd rapido --no-interactivo --duracion 120
      - name: 4_DETENER.cmd y comprobar que se soltaron los puertos
        if: always()
        shell: cmd
        run: |
          call scripts\laboratorio_integrado\4_DETENER.cmd
          call scripts\laboratorio_integrado\DIAGNOSTICO.cmd
          exit /b 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laboratorio-integrado-windows
          path: |
            ~/cauce-lab-integrado/informes/
            ~/cauce-lab-integrado/datos/logs/
